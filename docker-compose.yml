services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bidwhist
      POSTGRES_PASSWORD: bidwhist
      POSTGRES_DB: bidwhist
    ports:
      - "5432:5432"
    volumes:
      - bidwhist_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bidwhist"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    env_file:
      - .env
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://bidwhist:bidwhist@db:5432/bidwhist?schema=public
      CLIENT_ORIGIN: http://localhost:5173
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npx prisma db seed && npx tsx src/index.ts"

  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:4000
      VITE_SOCKET_URL: http://localhost:4000
    ports:
      - "5173:5173"
    depends_on:
      - server

volumes:
  bidwhist_pgdata:
